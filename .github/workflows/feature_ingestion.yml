name: Hourly Feature & Ingestion Pipeline

on:
  schedule:
    # Runs at the start of every hour (cron: 0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      city:
        description: 'Target city for weather & AQI ingestion'
        required: false
        default: 'Lahore'

jobs:
  ingest-and-reason:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Ingestion and LangGraph Agent Cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT || 'AgentWeather' }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
          TARGET_CITY: ${{ github.event.inputs.city || 'Lahore' }}
        run: |
          python -m src.pipeline.ingest

