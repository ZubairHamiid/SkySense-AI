name: Daily & Drift-Triggered Training Pipeline

on:
  schedule:
    # Runs every day at midnight UTC (cron: 0 0 * * *)
    - cron: '0 0 * * *'
  repository_dispatch:
    types: [drift_alert_retrain]
  workflow_dispatch:

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Training, Benchmarking & Model Registry Update
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT || 'skysense' }}
        run: |
          python -m src.pipeline.train

